name: "[00] PR diff statistics"
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pr-diff-statistics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  update-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update PR diff statistics comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = "<!-- pr-diff-statistics -->";
            const configPath = ".github/pr-diff-groups.json";

            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            const { data: content } = await github.rest.repos.getContent({
              owner,
              repo,
              path: configPath,
              ref: headSha,
            });

            if (Array.isArray(content) || content.type !== "file") {
              throw new Error(`${configPath} must be a file.`);
            }

            let config;
            try {
              config = JSON.parse(Buffer.from(content.content, "base64").toString("utf8"));
            } catch (error) {
              throw new Error(`${configPath} must contain valid JSON: ${error.message}`);
            }

            if (!config || typeof config !== "object" || Array.isArray(config)) {
              throw new Error(`${configPath} must contain a JSON object.`);
            }
            if (config.version !== 1) {
              throw new Error(`${configPath}: version must be 1.`);
            }
            if (!Array.isArray(config.groups) || config.groups.length === 0) {
              throw new Error(`${configPath}: groups must be a non-empty array.`);
            }
            if (typeof config.fallbackLabel !== "string" || config.fallbackLabel.trim() === "") {
              throw new Error(`${configPath}: fallbackLabel must be a non-empty string.`);
            }

            const ids = new Set();
            for (const [index, group] of config.groups.entries()) {
              const prefix = `${configPath}: groups[${index}]`;
              if (!group || typeof group !== "object" || Array.isArray(group)) {
                throw new Error(`${prefix} must be an object.`);
              }
              if (typeof group.id !== "string" || group.id.trim() === "") {
                throw new Error(`${prefix}.id must be a non-empty string.`);
              }
              if (ids.has(group.id)) {
                throw new Error(`${configPath}: duplicate group id ${JSON.stringify(group.id)}.`);
              }
              ids.add(group.id);
              if (typeof group.label !== "string" || group.label.trim() === "") {
                throw new Error(`${prefix}.label must be a non-empty string.`);
              }
              if (
                !Array.isArray(group.includeSuffixes) ||
                group.includeSuffixes.length === 0 ||
                group.includeSuffixes.some(
                  (suffix) => typeof suffix !== "string" || suffix.trim() === "",
                )
              ) {
                throw new Error(`${prefix}.includeSuffixes must be a non-empty string array.`);
              }
              if (
                group.excludeSuffixes !== undefined &&
                (!Array.isArray(group.excludeSuffixes) ||
                  group.excludeSuffixes.some(
                    (suffix) => typeof suffix !== "string" || suffix.trim() === "",
                  ))
              ) {
                throw new Error(`${prefix}.excludeSuffixes must be a string array when provided.`);
              }
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pullNumber,
              per_page: 100,
            });

            const statistics = config.groups.map((group) => ({
              group,
              files: 0,
              additions: 0,
              deletions: 0,
            }));
            const fallback = {
              files: 0,
              additions: 0,
              deletions: 0,
            };

            for (const file of files) {
              const entry = statistics.find(({ group }) => {
                const included = group.includeSuffixes.some((suffix) =>
                  file.filename.endsWith(suffix),
                );
                const excluded = (group.excludeSuffixes ?? []).some((suffix) =>
                  file.filename.endsWith(suffix),
                );
                return included && !excluded;
              });
              const target = entry ?? fallback;
              target.files += 1;
              target.additions += file.additions;
              target.deletions += file.deletions;
            }

            const formatSuffixes = (suffixes) => suffixes.map((suffix) => `\`${suffix}\``).join(", ");
            const rows = statistics.map(({ group, files, additions, deletions }) => {
              const exclusions = group.excludeSuffixes?.length
                ? ` excluding ${formatSuffixes(group.excludeSuffixes)}`
                : "";
              return `| ${group.label} | ${formatSuffixes(group.includeSuffixes)}${exclusions} | ${files} | +${additions} | -${deletions} | ${additions + deletions} |`;
            });
            rows.push(
              `| ${config.fallbackLabel} | 上記以外 | ${fallback.files} | +${fallback.additions} | -${fallback.deletions} | ${fallback.additions + fallback.deletions} |`,
            );

            const totals = statistics.reduce(
              (result, entry) => ({
                files: result.files + entry.files,
                additions: result.additions + entry.additions,
                deletions: result.deletions + entry.deletions,
              }),
              { ...fallback },
            );

            const body = [
              marker,
              "## PR差分統計",
              "",
              "| 分類 | 対象 | ファイル数 | 追加 | 削除 | 編集行数 |",
              "| --- | --- | ---: | ---: | ---: | ---: |",
              ...rows,
              "",
              `**合計:** ${totals.files}ファイル / +${totals.additions} / -${totals.deletions}`,
              "",
              `<sub>Commit: \`${headSha.slice(0, 7)}\`</sub>`,
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated diff statistics comment on PR #${pullNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pullNumber,
                body,
              });
              core.info(`Created diff statistics comment on PR #${pullNumber}.`);
            }
